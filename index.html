<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panorama Eleitoral — Municípios do RJ</title>
    <link href="/styles/main.css" rel="stylesheet" />
</head>

<body>
    <div id="pagediv">
        <header id="topBar">
            <h1>Panorama Eleitoral — Municípios do RJ</h1>
            <p>
                Autoria: Glauco Azevedo
                <a href="https://github.com/azbr" aria-label="Perfil no GitHub">
                    <img id="git" src="/github-mark.svg" alt="" width="16" height="16" />
                </a>
                — FGV/EMAp — Rio de Janeiro
            </p>
            <p>
                Visualização com <strong>D3.js 7</strong>: mapa coroplético das prefeituras e diagrama Sankey da câmara municipal.
            </p>
        </header>

        <main id="centerblock">
            <label for="uf-option" class="visually-hidden">Estado</label>
            <select id="uf-option" aria-label="Unidade federativa">
                <option value="AC" disabled>Acre</option>
                <option value="AL" disabled>Alagoas</option>
                <option value="AP" disabled>Amapá</option>
                <option value="AM" disabled>Amazonas</option>
                <option value="BA" disabled>Bahia</option>
                <option value="CE" disabled>Ceará</option>
                <option value="DF" disabled>Distrito Federal</option>
                <option value="ES" disabled>Espírito Santo</option>
                <option value="GO" disabled>Goiás</option>
                <option value="MA" disabled>Maranhão</option>
                <option value="MT" disabled>Mato Grosso</option>
                <option value="MS" disabled>Mato Grosso do Sul</option>
                <option value="MG" disabled>Minas Gerais</option>
                <option value="PA" disabled>Pará</option>
                <option value="PB" disabled>Paraíba</option>
                <option value="PR" disabled>Paraná</option>
                <option value="PE" disabled>Pernambuco</option>
                <option value="PI" disabled>Piauí</option>
                <option value="RJ" selected>Rio de Janeiro</option>
                <option value="RN" disabled>Rio Grande do Norte</option>
                <option value="RS" disabled>Rio Grande do Sul</option>
                <option value="RO" disabled>Rondônia</option>
                <option value="RR" disabled>Roraima</option>
                <option value="SC" disabled>Santa Catarina</option>
                <option value="SP" disabled>São Paulo</option>
                <option value="SE" disabled>Sergipe</option>
                <option value="TO" disabled>Tocantins</option>
            </select>

            <section id="mapas" aria-labelledby="mapa-titulo">
                <h2 id="mapa-titulo" class="visually-hidden">Mapa de prefeituras</h2>
                <svg id="mainChart" role="img" aria-label="Mapa coroplético dos municípios do Rio de Janeiro"></svg>
                <div id="timescroll" role="group" aria-label="Navegação por ano eleitoral">
                    <button type="button" id="previous" aria-label="Ano anterior">Anterior</button>
                    <div id="ano-atual" aria-live="polite" aria-atomic="true"></div>
                    <button type="button" id="next" aria-label="Próximo ano">Próximo</button>
                </div>
            </section>

            <section id="sankey" aria-labelledby="sankey-titulo">
                <h2 id="sankey-titulo" class="visually-hidden">Composição da câmara municipal</h2>
                <p id="sankey-message" class="sankey-message sankey-message--hint"></p>
                <svg id="sankeyChart" role="img" aria-label="Diagrama Sankey da câmara municipal" aria-hidden="true"></svg>
            </section>

            <aside id="lista-features" aria-label="Legenda e instruções"></aside>
        </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
